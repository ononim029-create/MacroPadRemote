name: Fix NEXO v1.1 WPF splash
on:
  push:
    branches: [feature/nexo-v11-tablet-installer]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[wpf-splash-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/nexo-v11-tablet-installer
      - name: Remove unsupported WPF property
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/windows/MacroPadRemote/MainWindow.xaml')
          s = p.read_text(encoding='utf-8')
          old = ' CharacterSpacing="220"'
          if old not in s:
              raise SystemExit('CharacterSpacing marker not found')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows/MacroPadRemote/MainWindow.xaml
          git commit -m "NEXO v1.1: fix WPF startup splash [wpf-splash-fixed]"
          git push origin HEAD:feature/nexo-v11-tablet-installer
