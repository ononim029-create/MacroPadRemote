name: Build MacroPad Remote
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore verified v0.7 sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $partNames = @(
            'bootstrap/v07_payload_00_0','bootstrap/v07_payload_00_1','bootstrap/v07_payload_00_2','bootstrap/v07_payload_00_3',
            'bootstrap/v07_payload_01_0','bootstrap/v07_payload_01_1','bootstrap/v07_payload_01_2','bootstrap/v07_payload_01_3',
            'bootstrap/v07safe_02_0','bootstrap/v07safe_02_1','bootstrap/v07safe_02_2','bootstrap/v07safe_02_3',
            'bootstrap/v07safe_03_0','bootstrap/v07safe_03_1','bootstrap/v07safe_03_2','bootstrap/v07safe_03_3'
          )
          $b64 = ($partNames | ForEach-Object { Get-Content $_ -Raw }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'v07.tar.xz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $expected = 'e2efec5be8b9b830e241f1d35e666e680d054b90305b5f29eaf4599ecda9993b'
          if ($actual -ne $expected) { throw "v0.7 payload SHA256 mismatch: $actual" }
          $src = Join-Path $env:RUNNER_TEMP 'v07src'
          New-Item -ItemType Directory -Force $src | Out-Null
          tar -xJf $archive -C $src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$src/windows/*" src/windows/MacroPadRemote/ -Force
          New-Item -ItemType Directory -Force src/mobile/macropad_mobile/lib | Out-Null
          Copy-Item "$src/mobile/pubspec.yaml" src/mobile/macropad_mobile/pubspec.yaml -Force
          Copy-Item "$src/mobile/lib/main.dart" src/mobile/macropad_mobile/lib/main.dart -Force
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/windows/MacroPadRemote/MacroPadRemote.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/windows/* -DestinationPath dist/MacroPadRemote-win-x64.zip -Force
      - uses: actions/upload-artifact@v6
        with:
          name: MacroPadRemote-win-x64
          path: |
            dist/MacroPadRemote-win-x64.zip
            dist/windows/**

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore verified v0.7 sources
        shell: bash
        run: |
          set -euo pipefail
          cat \
            bootstrap/v07_payload_00_0 bootstrap/v07_payload_00_1 bootstrap/v07_payload_00_2 bootstrap/v07_payload_00_3 \
            bootstrap/v07_payload_01_0 bootstrap/v07_payload_01_1 bootstrap/v07_payload_01_2 bootstrap/v07_payload_01_3 \
            bootstrap/v07safe_02_0 bootstrap/v07safe_02_1 bootstrap/v07safe_02_2 bootstrap/v07safe_02_3 \
            bootstrap/v07safe_03_0 bootstrap/v07safe_03_1 bootstrap/v07safe_03_2 bootstrap/v07safe_03_3 \
            | base64 -d > /tmp/v07.tar.xz
          echo 'e2efec5be8b9b830e241f1d35e666e680d054b90305b5f29eaf4599ecda9993b  /tmp/v07.tar.xz' | sha256sum -c -
          rm -rf /tmp/v07src && mkdir -p /tmp/v07src
          tar -xJf /tmp/v07.tar.xz -C /tmp/v07src
          cp /tmp/v07src/mobile/pubspec.yaml src/mobile/macropad_mobile/pubspec.yaml
          mkdir -p src/mobile/macropad_mobile/lib
          cp /tmp/v07src/mobile/lib/main.dart src/mobile/macropad_mobile/lib/main.dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mobile
          flutter create build-mobile --platforms android --project-name macropad_remote
          cp src/mobile/macropad_mobile/pubspec.yaml build-mobile/pubspec.yaml
          cp src/mobile/macropad_mobile/lib/main.dart build-mobile/lib/main.dart
          rm -rf build-mobile/test
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('build-mobile/android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.CAMERA"/>',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>',
              '    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"/>'
          ]
          missing = [x for x in perms if x.split('android:name="',1)[1].split('"',1)[0] not in s]
          if missing:
              s = s.replace(marker, marker + '\n' + '\n'.join(missing))
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/macropad_icon"', s, count=1)
          if 'android:roundIcon=' not in s:
              s = s.replace('<application ', '<application android:roundIcon="@drawable/macropad_icon" ', 1)
          manifest.write_text(s)

          gradle = Path('build-mobile/android/app/build.gradle.kts')
          g = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          gradle.write_text(g)

          drawable = Path('build-mobile/android/app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'macropad_icon.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#17191B" android:pathData="M0,0 H108 V108 H0 Z"/>
              <path android:fillColor="#1688FF" android:pathData="M18,18 H48 V48 H18 Z"/>
              <path android:fillColor="#F2F2F2" android:pathData="M60,18 H90 V48 H60 Z M18,60 H48 V90 H18 Z"/>
              <path android:fillColor="#24272A" android:strokeColor="#F2F2F2" android:strokeWidth="3" android:pathData="M60,60 H90 V90 H60 Z"/>
          </vector>''')
          PY
      - name: Analyze and build APK
        shell: bash
        run: |
          cd build-mobile
          flutter pub get
          flutter analyze
          flutter build apk --release
      - uses: actions/upload-artifact@v6
        with:
          name: MacroPadRemote-android
          path: build-mobile/build/app/outputs/flutter-apk/app-release.apk

  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: MacroPadRemote-win-x64
          path: artifacts/windows
      - uses: actions/download-artifact@v7
        with:
          name: MacroPadRemote-android
          path: artifacts/android
      - name: Make update manifest
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP=artifacts/windows/MacroPadRemote-win-x64.zip
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          cat > preview.json <<JSON
          {"version":"0.7.0-preview","channel":"preview","packageUrl":"https://github.com/${GH_REPO}/releases/download/preview/MacroPadRemote-win-x64.zip","sha256":"${SHA}","mandatory":false,"notes":"v0.7: trusted devices, no-repeat QR, profile/page drawer, portrait phone scaling, connection settings, action hotfix"}
          JSON
      - name: Publish rolling preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view preview --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create preview --repo "$GH_REPO" --prerelease --title "MacroPad Remote Preview" --notes "Rolling preview build"
          fi
          gh release upload preview \
            artifacts/windows/MacroPadRemote-win-x64.zip \
            artifacts/android/app-release.apk \
            preview.json \
            --clobber \
            --repo "$GH_REPO"
