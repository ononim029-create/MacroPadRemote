name: Build MacroPad Remote
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore v0.6 Windows sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem bootstrap/v06_payload_0* | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'v06.tar.gz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $src = Join-Path $env:RUNNER_TEMP 'v06src'
          New-Item -ItemType Directory -Force $src | Out-Null
          tar -xzf $archive -C $src
          Copy-Item "$src/App.xaml" src/windows/MacroPadRemote/App.xaml -Force
          Copy-Item "$src/MainWindow.xaml" src/windows/MacroPadRemote/MainWindow.xaml -Force
          Copy-Item "$src/MainWindow.xaml.cs" src/windows/MacroPadRemote/MainWindow.xaml.cs -Force
          Copy-Item "$src/MacroPadRemote.csproj" src/windows/MacroPadRemote/MacroPadRemote.csproj -Force
          Copy-Item "$src/LanDiscoveryService.cs" src/windows/MacroPadRemote/LanDiscoveryService.cs -Force
          Copy-Item "$src/BleGattServer.cs" src/windows/MacroPadRemote/BleGattServer.cs -Force
          $csPath = 'src/windows/MacroPadRemote/MainWindow.xaml.cs'
          $cs = Get-Content $csPath -Raw
          $old = 'if (tile is not null) await Dispatcher.InvokeAsync(async () => await ExecuteTileAsync(tile));'
          $new = @'
          if (tile is not null)
                          {
                              var executeTask = await Dispatcher.InvokeAsync(() => ExecuteTileAsync(tile));
                              await executeTask;
                          }
          '@
          $cs = $cs.Replace($old, $new.Trim())
          Set-Content -Path $csPath -Value $cs -Encoding utf8 -NoNewline
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/windows/MacroPadRemote/MacroPadRemote.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/windows/* -DestinationPath dist/MacroPadRemote-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MacroPadRemote-win-x64
          path: |
            dist/MacroPadRemote-win-x64.zip
            dist/windows/**
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore v0.6 mobile sources
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/v06_payload_0* | base64 -d > /tmp/v06.tar.gz
          rm -rf /tmp/v06src && mkdir -p /tmp/v06src
          tar -xzf /tmp/v06.tar.gz -C /tmp/v06src
          cp /tmp/v06src/pubspec.yaml src/mobile/macropad_mobile/pubspec.yaml
          cp /tmp/v06src/main.dart src/mobile/macropad_mobile/lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/mobile/macropad_mobile/lib/main.dart')
          s=p.read_text()
          s=s.replace('await UniversalBle.unsubscribe(device.deviceId, serviceUuid, stateUuid);', "if (state != null) await state!.unsubscribe();")
          s=s.replace('final columns = p.columns.clamp(1, 12);', 'final columns = p.columns.clamp(1, 12).toInt();')
          s=s.replace("rowSpan: ((json['rowSpan'] as num?)?.toInt() ?? 1).clamp(1, 12),", "rowSpan: ((json['rowSpan'] as num?)?.toInt() ?? 1).clamp(1, 12).toInt(),")
          s=s.replace("columnSpan: ((json['columnSpan'] as num?)?.toInt() ?? 1).clamp(1, 12),", "columnSpan: ((json['columnSpan'] as num?)?.toInt() ?? 1).clamp(1, 12).toInt(),")
          s=s.replace('final rows = rawRows.clamp(1, 12);', 'final rows = rawRows.clamp(1, 12).toInt();')
          s=s.replace('final columns = rawColumns.clamp(1, 12);', 'final columns = rawColumns.clamp(1, 12).toInt();')
          p.write_text(s)
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mobile
          flutter create build-mobile --platforms android --project-name macropad_remote
          cp src/mobile/macropad_mobile/pubspec.yaml build-mobile/pubspec.yaml
          cp src/mobile/macropad_mobile/lib/main.dart build-mobile/lib/main.dart
          rm -rf build-mobile/test
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-mobile/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms=[
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.CAMERA"/>',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>',
              '    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"/>'
          ]
          missing=[x for x in perms if x.split('android:name="',1)[1].split('"',1)[0] not in s]
          if missing:
              s=s.replace(marker, marker+'\n'+'\n'.join(missing))
          if 'android:usesCleartextTraffic=' not in s:
              s=s.replace('<application','<application android:usesCleartextTraffic="true"',1)
          p.write_text(s)
          gradle=Path('build-mobile/android/app/build.gradle.kts')
          g=gradle.read_text()
          g=g.replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          gradle.write_text(g)
          PY
      - name: Analyze and build APK
        shell: bash
        run: |
          cd build-mobile
          flutter pub get
          flutter analyze
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MacroPadRemote-android
          path: build-mobile/build/app/outputs/flutter-apk/app-release.apk
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MacroPadRemote-win-x64
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: MacroPadRemote-android
          path: artifacts/android
      - name: Make update manifest
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP=artifacts/windows/MacroPadRemote-win-x64.zip
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          cat > preview.json <<JSON
          {"version":"0.6.0-preview","channel":"preview","packageUrl":"https://github.com/${GH_REPO}/releases/download/preview/MacroPadRemote-win-x64.zip","sha256":"${SHA}","mandatory":false,"notes":"MacroPad Remote v0.6: LAN discovery + QR auth, Stream Deck-style actions, BLE preview"}
          JSON
      - name: Publish rolling preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view preview --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create preview --repo "$GH_REPO" --prerelease --title "MacroPad Remote Preview" --notes "Rolling preview build"
          fi
          gh release upload preview \
            artifacts/windows/MacroPadRemote-win-x64.zip \
            artifacts/android/app-release.apk \
            preview.json \
            --clobber \
            --repo "$GH_REPO"
