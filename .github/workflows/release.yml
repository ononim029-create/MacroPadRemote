name: Build NEXO
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $icon = 'AAABAAEAICAAAAAAIACvAAAAFgAAAIlQTkcNChoKAAAADUlIRFIAAAAgAAAAIAgGAAAAc3p69AAAAHZJREFUeJxjFBIR+88wgIBpIC0fdcCgcAALVsGSl0Rp/tMjzsDAwMDw4N4dotQrKKlgiA14CIw6YNQBow4YdQDjiK+OsdYFpJbtlNQFWB1ADjAytcArf+70CaziAx4Fow4YdcCoA6hWDuDK54TAaF0w6oABdwAApPAVWO2My5AAAAAASUVORK5CYII='
          [IO.File]::WriteAllBytes('src/windows/MacroPadRemote/Nexo.ico', [Convert]::FromBase64String($icon))
          dotnet publish src/windows/MacroPadRemote/MacroPadRemote.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:ApplicationIcon=Nexo.ico -o dist/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/windows/NEXO.exe dist/NEXO.exe -Force
          Compress-Archive -Path dist/windows/* -DestinationPath dist/NEXO-win-x64.zip -Force
          $bat = @'
          @echo off
          setlocal EnableExtensions
          title NEXO Setup
          echo.
          echo ==============================
          echo        NEXO Setup v1.1
          echo ==============================
          echo.
          set "DEFAULT_DIR=%LOCALAPPDATA%\NEXO"
          set /p "INSTALL_DIR=Install folder [%DEFAULT_DIR%]: "
          if not defined INSTALL_DIR set "INSTALL_DIR=%DEFAULT_DIR%"
          echo.
          echo Downloading NEXO...
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $d=$env:INSTALL_DIR; $u='https://github.com/ononim029-create/MacroPadRemote/releases/download/preview/NEXO-win-x64.zip'; $z=Join-Path $env:TEMP 'NEXO-win-x64.zip'; Invoke-WebRequest -UseBasicParsing $u -OutFile $z; if(Test-Path $d){Remove-Item $d -Recurse -Force}; New-Item -ItemType Directory -Force $d | Out-Null; Expand-Archive $z $d -Force; Remove-Item $z -Force"
          if errorlevel 1 goto :fail
          set /p "SHORTCUT=Create desktop shortcut? [Y/n]: "
          if /I not "%SHORTCUT%"=="n" powershell -NoProfile -ExecutionPolicy Bypass -Command "$d=$env:INSTALL_DIR; $ws=New-Object -ComObject WScript.Shell; $s=$ws.CreateShortcut([Environment]::GetFolderPath('Desktop')+'\NEXO.lnk'); $s.TargetPath=Join-Path $d 'NEXO.exe'; $s.WorkingDirectory=$d; $s.Description='NEXO'; $s.Save()"
          echo.
          echo NEXO installed to: %INSTALL_DIR%
          set /p "RUN=Launch NEXO now? [Y/n]: "
          if /I not "%RUN%"=="n" start "" "%INSTALL_DIR%\NEXO.exe"
          exit /b 0
          :fail
          echo Installation failed. Check internet connection and permissions.
          pause
          exit /b 1
          '@
          Set-Content -Path dist/NEXO-Setup.bat -Value $bat -Encoding ASCII
      - uses: actions/upload-artifact@v6
        with:
          name: NEXO-win-x64
          path: |
            dist/NEXO-win-x64.zip
            dist/NEXO.exe
            dist/NEXO-Setup.bat
            dist/windows/**

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mobile
          flutter create build-mobile --platforms android --project-name nexo
          cp src/mobile/macropad_mobile/pubspec.yaml build-mobile/pubspec.yaml
          cp src/mobile/macropad_mobile/lib/main.dart build-mobile/lib/main.dart
          rm -rf build-mobile/test
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('build-mobile/android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.CAMERA"/>',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>',
              '    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"/>'
          ]
          missing = [x for x in perms if x.split('android:name="',1)[1].split('"',1)[0] not in s]
          if missing:
              s = s.replace(marker, marker + '\n' + '\n'.join(missing))
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="NEXO"', s, count=1)
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/nexo_icon"', s, count=1)
          if 'android:roundIcon=' not in s:
              s = s.replace('<application ', '<application android:roundIcon="@drawable/nexo_icon" ', 1)
          manifest.write_text(s)

          gradle = Path('build-mobile/android/app/build.gradle.kts')
          g = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          gradle.write_text(g)

          main_activity = Path('build-mobile/android/app/src/main/kotlin/com/example/nexo/MainActivity.kt')
          main_activity.parent.mkdir(parents=True, exist_ok=True)
          main_activity.write_text(r'''package com.example.nexo

import android.content.Context
import android.hardware.input.InputManager
import android.view.InputDevice
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel

class MainActivity : FlutterActivity(), InputManager.InputDeviceListener {
    private val channelName = "nexo/device"
    private lateinit var inputManager: InputManager
    private var channel: MethodChannel? = null

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        inputManager = getSystemService(Context.INPUT_SERVICE) as InputManager
        inputManager.registerInputDeviceListener(this, null)
        channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
        channel?.setMethodCallHandler { call, result ->
            if (call.method == "hasHardwareKeyboard") result.success(hasHardwareKeyboard()) else result.notImplemented()
        }
    }

    private fun hasHardwareKeyboard(): Boolean = InputDevice.getDeviceIds().any { id ->
        val device = InputDevice.getDevice(id) ?: return@any false
        !device.isVirtual &&
            device.keyboardType == InputDevice.KEYBOARD_TYPE_ALPHABETIC &&
            (device.sources and InputDevice.SOURCE_KEYBOARD) == InputDevice.SOURCE_KEYBOARD
    }

    private fun publishKeyboardState() { channel?.invokeMethod("hardwareKeyboardChanged", hasHardwareKeyboard()) }
    override fun onInputDeviceAdded(deviceId: Int) = publishKeyboardState()
    override fun onInputDeviceRemoved(deviceId: Int) = publishKeyboardState()
    override fun onInputDeviceChanged(deviceId: Int) = publishKeyboardState()
    override fun onDestroy() {
        if (::inputManager.isInitialized) inputManager.unregisterInputDeviceListener(this)
        super.onDestroy()
    }
}
''')

          drawable = Path('build-mobile/android/app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'nexo_icon.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#121416" android:pathData="M0,0 H108 V108 H0 Z"/>
              <path android:fillColor="#1688FF" android:pathData="M18,18 H48 V48 H18 Z"/>
              <path android:fillColor="#F2F2F2" android:pathData="M60,18 H90 V48 H60 Z M18,60 H48 V90 H18 Z"/>
              <path android:fillColor="#24272A" android:strokeColor="#F2F2F2" android:strokeWidth="3" android:pathData="M60,60 H90 V90 H60 Z"/>
          </vector>''')
          PY
      - name: Analyze and build APK
        shell: bash
        run: |
          cd build-mobile
          flutter pub get
          flutter analyze
          flutter build apk --release
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/NEXO-android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: NEXO-android
          path: dist/NEXO-android.apk

  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: NEXO-win-x64
          path: artifacts/windows
      - uses: actions/download-artifact@v7
        with:
          name: NEXO-android
          path: artifacts/android
      - name: Make update manifest
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP=artifacts/windows/NEXO-win-x64.zip
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          cat > preview.json <<JSON
          {"version":"1.1.0-preview","channel":"preview","packageUrl":"https://github.com/${GH_REPO}/releases/download/preview/NEXO-win-x64.zip","sha256":"${SHA}","mandatory":false,"notes":"NEXO v1.1: tablet mode with scalable remote keyboard and physical-keyboard detection, unified startup animation/icon, stability pass, standalone EXE and BAT installer"}
          JSON
      - name: Publish rolling preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view preview --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create preview --repo "$GH_REPO" --prerelease --title "NEXO Preview" --notes "Rolling preview build"
          fi
          gh release upload preview \
            artifacts/windows/NEXO-win-x64.zip \
            artifacts/windows/NEXO.exe \
            artifacts/windows/NEXO-Setup.bat \
            artifacts/android/NEXO-android.apk \
            preview.json \
            --clobber \
            --repo "$GH_REPO"
