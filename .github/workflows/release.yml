name: Build NEXO

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Apply v1.2 Windows patches
        shell: pwsh
        run: |
          python tools/apply_v12_patches.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/apply_v12_integration.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Windows x64 and native installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iconBase64 = (Get-Content 'src/windows/MacroPadRemote/Nexo.ico.b64' -Raw).Trim()
          $iconBytes = [Convert]::FromBase64String($iconBase64)
          [IO.File]::WriteAllBytes('src/windows/MacroPadRemote/Nexo.ico', $iconBytes)

          dotnet publish src/windows/MacroPadRemote/MacroPadRemote.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:ApplicationIcon=Nexo.ico -o dist/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem dist/windows -Filter *.pdb -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          Compress-Archive -Path dist/windows/* -DestinationPath dist/NEXO-win-x64.zip -Force

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found: $iscc" }

          & $iscc 'installer\NEXO.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'dist\NEXO-Setup.exe')) { throw 'NEXO-Setup.exe was not produced by Inno Setup.' }

          Copy-Item installer/NEXO-Setup.bat dist/NEXO-Setup.bat -Force

      - uses: actions/upload-artifact@v6
        with:
          name: NEXO-win-x64
          compression-level: 0
          path: |
            dist/NEXO-Setup.exe
            dist/NEXO-Setup.bat
            dist/NEXO-win-x64.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply v1.2.2 mobile patches
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v12_patches.py mobile
          python3 tools/apply_v12_integration.py mobile
          python3 tools/fix_v12_flutter.py
          python3 tools/apply_v121_fixes.py mobile
          python3 tools/fix_v121_layout.py
          python3 tools/apply_v122_keyboard.py
      - name: Create Android host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mobile
          flutter create build-mobile --platforms android --project-name nexo
          cp src/mobile/macropad_mobile/pubspec.yaml build-mobile/pubspec.yaml
          cp src/mobile/macropad_mobile/lib/main.dart build-mobile/lib/main.dart
          cp src/mobile/macropad_mobile/lib/v12_workspace.dart build-mobile/lib/v12_workspace.dart
          rm -rf build-mobile/test
          mkdir -p build-mobile/android/app/src/main/kotlin/com/example/nexo
          mkdir -p build-mobile/android/app/src/main/res/drawable
          cp src/mobile/android_host/MainActivity.kt build-mobile/android/app/src/main/kotlin/com/example/nexo/MainActivity.kt
          cp src/mobile/android_host/nexo_icon.xml build-mobile/android/app/src/main/res/drawable/nexo_icon.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('build-mobile/android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.CAMERA"/>',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>',
              '    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"/>'
          ]
          missing = [x for x in perms if x.split('android:name="', 1)[1].split('"', 1)[0] not in s]
          if missing:
              s = s.replace(marker, marker + '\n' + '\n'.join(missing))
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="NEXO"', s, count=1)
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/nexo_icon"', s, count=1)
          if 'android:roundIcon=' not in s:
              s = s.replace('<application ', '<application android:roundIcon="@drawable/nexo_icon" ', 1)
          manifest.write_text(s)
          gradle = Path('build-mobile/android/app/build.gradle.kts')
          gradle.write_text(gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 24'))
          PY
      - name: Analyze and build APK
        shell: bash
        run: |
          cd build-mobile
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build apk --release
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/NEXO-android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: NEXO-android
          path: dist/NEXO-android.apk

  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: NEXO-win-x64
          path: artifacts/windows
      - uses: actions/download-artifact@v7
        with:
          name: NEXO-android
          path: artifacts/android
      - name: Make update manifest
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP=artifacts/windows/NEXO-win-x64.zip
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          printf '%s\n' "{\"version\":\"1.2.2-preview\",\"channel\":\"preview\",\"packageUrl\":\"https://github.com/${GH_REPO}/releases/download/preview/NEXO-win-x64.zip\",\"sha256\":\"${SHA}\",\"mandatory\":false,\"notes\":\"NEXO v1.2.2: clean EN/RU on-screen keyboard legends with QWERTY-style Shift symbols\"}" > preview.json
      - name: Publish rolling preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view preview --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create preview --repo "$GH_REPO" --prerelease --title "NEXO Preview" --notes "Rolling preview build"
          fi

          gh release upload preview \
            artifacts/windows/NEXO-Setup.exe \
            artifacts/windows/NEXO-Setup.bat \
            preview.json \
            --clobber \
            --repo "$GH_REPO"

          gh release upload preview artifacts/windows/NEXO-win-x64.zip --clobber --repo "$GH_REPO"
          gh release upload preview artifacts/android/NEXO-android.apk --clobber --repo "$GH_REPO"
