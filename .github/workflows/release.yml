name: Build MacroPad Remote
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/windows/MacroPadRemote/MacroPadRemote.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/windows/* -DestinationPath dist/MacroPadRemote-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MacroPadRemote-win-x64
          path: |
            dist/MacroPadRemote-win-x64.zip
            dist/windows/**
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android host
        shell: bash
        run: |
          rm -rf build-mobile
          flutter create build-mobile --platforms android --project-name macropad_remote
          cp src/mobile/macropad_mobile/pubspec.yaml build-mobile/pubspec.yaml
          cp src/mobile/macropad_mobile/lib/main.dart build-mobile/lib/main.dart
          rm -rf build-mobile/test
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-mobile/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          s=s.replace('<application','<application android:usesCleartextTraffic="true"',1)
          p.write_text(s)
          PY
      - name: Analyze and build APK
        shell: bash
        run: |
          cd build-mobile
          flutter pub get
          flutter analyze
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MacroPadRemote-android
          path: build-mobile/build/app/outputs/flutter-apk/app-release.apk
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MacroPadRemote-win-x64
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: MacroPadRemote-android
          path: artifacts/android
      - name: Make update manifest
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP=artifacts/windows/MacroPadRemote-win-x64.zip
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          cat > preview.json <<JSON
          {"version":"0.5.1-preview","channel":"preview","packageUrl":"https://github.com/${GH_REPO}/releases/download/preview/MacroPadRemote-win-x64.zip","sha256":"${SHA}","mandatory":false,"notes":"MacroPad Remote v0.5.1 UI feedback preview"}
          JSON
      - name: Publish rolling preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view preview --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create preview --repo "$GH_REPO" --prerelease --title "MacroPad Remote Preview" --notes "Rolling preview build"
          fi
          gh release upload preview \
            artifacts/windows/MacroPadRemote-win-x64.zip \
            artifacts/android/app-release.apk \
            preview.json \
            --clobber \
            --repo "$GH_REPO"
