name: Build NODERA Mobile RC87 APK
on:
  push:
    branches:
      - build/nodera-mobile-rc87-apk
    paths:
      - '.github/workflows/nodera-mobile-apk.yml'
      - 'nodera-mobile-rc87-source.b64'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract NODERA Android project
        run: |
          mkdir -p nodera-build
          base64 --decode nodera-mobile-rc87-source.b64 > nodera-src.tar.xz
          tar -xJf nodera-src.tar.xz -C nodera-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build APK
        working-directory: nodera-build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: |
          test -s nodera-build/app/build/outputs/apk/debug/app-debug.apk
          sha256sum nodera-build/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NODERA-Mobile-RC87-APK
          path: nodera-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
