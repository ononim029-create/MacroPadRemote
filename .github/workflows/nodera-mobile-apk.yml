name: Build NODERA Mobile RC88 APK
on:
  push:
    branches: [build/nodera-mobile-rc88-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Android debug APK
        working-directory: nodera-mobile-rc88
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify installable APK
        run: |
          test -s nodera-mobile-rc87/app/build/outputs/apk/debug/app-debug.apk
          sha256sum nodera-mobile-rc87/app/build/outputs/apk/debug/app-debug.apk
      - name: Android emulator smoke test (API 29)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r nodera-mobile-rc87/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.domokrat.nodera.mobile/.MainActivity
            sleep 8
            adb logcat -d -s AndroidRuntime:E > android-runtime-error.log
            cat android-runtime-error.log
            if grep -q 'FATAL EXCEPTION' android-runtime-error.log; then
              echo "NODERA Android crashed at startup"
              exit 1
            fi
            adb shell pidof com.domokrat.nodera.mobile
      - uses: actions/upload-artifact@v4
        with:
          name: NODERA-Mobile-RC88-APK
          path: nodera-mobile-rc87/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
