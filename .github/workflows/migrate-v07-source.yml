name: Migrate v0.7 sources into repository
on:
  push:
    branches: [work/v0.8-reliability]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[source-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/v0.8-reliability
          fetch-depth: 0
      - name: Restore verified v0.7 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            bootstrap/v07_payload_00_0 bootstrap/v07_payload_00_1 bootstrap/v07_payload_00_2 bootstrap/v07_payload_00_3 \
            bootstrap/v07_payload_01_0 bootstrap/v07_payload_01_1 bootstrap/v07_payload_01_2 bootstrap/v07_payload_01_3 \
            bootstrap/v07safe_02_0 bootstrap/v07safe_02_1 bootstrap/v07safe_02_2 bootstrap/v07safe_02_3 \
            bootstrap/v07safe_03_0 bootstrap/v07safe_03_1 bootstrap/v07safe_03_2 bootstrap/v07safe_03_3 \
            | base64 -d > /tmp/v07.tar.xz
          echo 'e2efec5be8b9b830e241f1d35e666e680d054b90305b5f29eaf4599ecda9993b  /tmp/v07.tar.xz' | sha256sum -c -
          rm -rf /tmp/v07src && mkdir -p /tmp/v07src
          tar -xJf /tmp/v07.tar.xz -C /tmp/v07src
      - name: Install restored sources as canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/windows/MacroPadRemote
          mkdir -p src/windows/MacroPadRemote
          cp /tmp/v07src/windows/App.xaml src/windows/MacroPadRemote/
          cp /tmp/v07src/windows/App.xaml.cs src/windows/MacroPadRemote/
          cp /tmp/v07src/windows/MacroPadRemote.csproj src/windows/MacroPadRemote/
          cp /tmp/v07src/windows/MainWindow.xaml src/windows/MacroPadRemote/
          cp /tmp/v07src/windows/MainWindow.xaml.cs src/windows/MacroPadRemote/
          cp /tmp/v07src/windows/V06GlobalUsings.cs src/windows/MacroPadRemote/
          cp /tmp/v07src/windows/BleGattServer.cs src/windows/MacroPadRemote/
          cp /tmp/v07src/windows/LanDiscoveryService.cs src/windows/MacroPadRemote/
          mkdir -p src/mobile/macropad_mobile/lib
          cp /tmp/v07src/mobile/pubspec.yaml src/mobile/macropad_mobile/pubspec.yaml
          cp /tmp/v07src/mobile/lib/main.dart src/mobile/macropad_mobile/lib/main.dart
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('src/mobile/macropad_mobile/lib/main.dart')
          s = p.read_text()
          s = s.replace('Navigator.of(this.context).pop(pc.serverId);', 'Navigator.of(context).pop(pc.serverId);')
          s = s.replace('for (var x = 0; x < cs; x++) used[row + y][column + x] = true;', 'for (var x = 0; x < cs; x++) {\n            used[row + y][column + x] = true;\n          }')
          p.write_text(s)
          PYFIX
      - name: Make release workflow build canonical sources directly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('.github/workflows/release.yml')
          s = p.read_text()
          s, n1 = re.subn(r'      - name: Restore verified v0\.7 sources\n        shell: pwsh\n        run: \|\n.*?(?=      - uses: actions/setup-dotnet@v5\n)', '', s, count=1, flags=re.S)
          s, n2 = re.subn(r'      - name: Restore verified v0\.7 sources\n        shell: bash\n        run: \|\n.*?(?=      - uses: subosito/flutter-action@v2\n)', '', s, count=1, flags=re.S)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Could not remove bootstrap restore steps: windows={n1}, android={n2}')
          p.write_text(s)
          PY
          rm -f .github/workflows/export-v07-source.yml .github/workflows/migrate-v07-source.yml
      - name: Commit canonical source migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src .github/workflows
          git commit -m 'Store verified v0.7 sources directly [source-migrated]'
          git push origin HEAD:work/v0.8-reliability
