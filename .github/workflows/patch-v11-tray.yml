name: Apply NEXO v1.1 Windows tray
on:
  push:
    branches: [feature/nexo-v11-tablet-installer]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nexo-v11-tray]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/nexo-v11-tablet-installer
      - name: Apply Windows tray patch
        run: python3 tools/apply_v11_tray.py
      - name: Commit Windows source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows/MacroPadRemote/MainWindow.xaml src/windows/MacroPadRemote/MainWindow.xaml.cs
          git commit -m "NEXO v1.1: Windows tray mode and startup loading [nexo-v11-tray]"
          git push origin HEAD:feature/nexo-v11-tablet-installer
