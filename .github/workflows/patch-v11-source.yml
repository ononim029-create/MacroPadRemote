name: Apply NEXO v1.1 sources
on:
  push:
    branches: [feature/nexo-v11-tablet-installer]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nexo-v11-source]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/nexo-v11-tablet-installer
      - name: Repair patcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v11.py')
          s=p.read_text()
          s=s.replace("native_patch = r'''\n\n          main_activity", "native_patch = r\"\"\"\n\n          main_activity", 1)
          marker="''')\n'''\nw = replace_once(w, \"          drawable = Path('build-mobile/android/app/src/main/res/drawable')\""
          replacement="''')\n\"\"\"\nw = replace_once(w, \"          drawable = Path('build-mobile/android/app/src/main/res/drawable')\""
          if marker in s: s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
      - name: Apply source patch
        run: python3 tools/apply_v11.py
      - name: Keep workflow unchanged in this commit
        run: git checkout -- .github/workflows/release.yml
      - name: Commit app sources only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "NEXO v1.1: tablet mode and startup polish [nexo-v11-source]"
          git push origin HEAD:feature/nexo-v11-tablet-installer
