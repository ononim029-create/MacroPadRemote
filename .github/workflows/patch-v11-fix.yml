name: Fix NEXO v1.1 patcher
on:
  push:
    branches: [feature/nexo-v11-tablet-installer]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nexo-v11-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/nexo-v11-tablet-installer
      - name: Repair nested Kotlin template quotes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v11.py')
          s=p.read_text()
          s=s.replace("native_patch = r'''\n\n          main_activity", "native_patch = r\"\"\"\n\n          main_activity", 1)
          marker="''')\n'''\nw = replace_once(w, \"          drawable = Path('build-mobile/android/app/src/main/res/drawable')\""
          replacement="''')\n\"\"\"\nw = replace_once(w, \"          drawable = Path('build-mobile/android/app/src/main/res/drawable')\""
          if marker not in s:
              raise SystemExit('native patch closing marker not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
      - name: Apply v1.1 patch
        run: python3 tools/apply_v11.py
      - name: Remove one-shot patch files
        run: rm -f tools/apply_v11.py .github/workflows/patch-v11.yml .github/workflows/patch-v11-fix.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NEXO v1.1: tablet mode, unified startup and installer [nexo-v11-patched]"
          git push origin HEAD:feature/nexo-v11-tablet-installer
