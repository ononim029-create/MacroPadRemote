name: Patch NEXO v1.0
on:
  push:
    branches: [ feature/nexo-v10-workspace-controls ]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nexo-v10-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/nexo-v10-workspace-controls
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_v10.py
      - name: Remove one-shot patch files
        run: rm -f tools/patch_v10.py .github/workflows/patch-v10.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NEXO v1.0: workspace controls and desktop layout [nexo-v10-patched]"
          git push origin HEAD:feature/nexo-v10-workspace-controls
