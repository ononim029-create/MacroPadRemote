name: Apply v0.8 icon patch
on:
  push:
    branches:
      - feature/icon-library-screenshot
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/icon-library-screenshot
          fetch-depth: 0
      - name: Apply source patch
        run: python3 tools/patch_v08_icons.py
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src .github/workflows/release.yml
          git commit -m "v0.8: add macro icon library and screenshot icons [icons-patched]"
          git push origin HEAD:feature/icon-library-screenshot
