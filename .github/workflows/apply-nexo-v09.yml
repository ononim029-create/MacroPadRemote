name: Apply NEXO v0.9 patch
on:
  workflow_dispatch:
  push:
    branches: [feature/nexo-v09-mobile-layout]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[nexo-v09-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/nexo-v09-mobile-layout
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_nexo_v09.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src .github/workflows/release.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NEXO v0.9: mobile workspace and device controls [nexo-v09-patched]"
          git push origin HEAD:feature/nexo-v09-mobile-layout
